name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/WikarIsland/WikarIsland.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Add Xray-core (VLESS)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath publish/xray -Force
          Get-ChildItem publish/xray

      - name: Add PresentMon (FPS in games)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path publish/presentmon | Out-Null
          gh release download -R GameTechDev/PresentMon --pattern "PresentMon-*-x64.exe" --output publish/presentmon/PresentMon.exe --clobber
          if (-not (Test-Path publish/presentmon/PresentMon.exe)) { throw "PresentMon not downloaded" }
          Get-ChildItem publish/presentmon

      - name: Add sing-box (VPN TUN mode)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # формат конфига — sing-box 1.12; берём свежую 1.12.x, а не «последнюю» (новые версии меняют формат)
          $tag = gh release list -R SagerNet/sing-box --limit 80 --exclude-pre-releases --json tagName -q '.[].tagName' | Where-Object { $_ -match '^v1\.12\.\d+$' } | Select-Object -First 1
          if (-not $tag) { throw "sing-box 1.12.x not found" }
          gh release download $tag -R SagerNet/sing-box --pattern "sing-box-*-windows-amd64.zip" --output singbox.zip --clobber
          Expand-Archive singbox.zip -DestinationPath singbox-tmp -Force
          New-Item -ItemType Directory -Force -Path publish/sing-box | Out-Null
          Get-ChildItem singbox-tmp -Recurse -Filter sing-box.exe | Select-Object -First 1 | Copy-Item -Destination publish/sing-box/
          if (-not (Test-Path publish/sing-box/sing-box.exe)) { throw "sing-box.exe missing" }
          Write-Host "sing-box $tag"

      - name: Add ad blocker (uBlock Origin Lite, optional)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh release list -R uBlockOrigin/uBOL-home --limit 20 --json tagName -q '.[].tagName'
          foreach ($t in $tags) {
            gh release download $t -R uBlockOrigin/uBOL-home --pattern "*chromium*.zip" --output ubol.zip --clobber 2>$null
            if (Test-Path ubol.zip) { Write-Host "uBOL $t"; break }
          }
          if (-not (Test-Path ubol.zip)) { throw "uBOL chromium package not found" }
          Expand-Archive ubol.zip -DestinationPath publish/adblock -Force
          Get-ChildItem -Recurse publish/adblock -Filter manifest.json

      - name: Add HeadsetControl (headset battery, optional)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # github.com/Sapd/HeadsetControl (GPL-3.0) — консольная программа рядом с островом, остров только читает её вывод.
          # Берём только готовый консольный exe (headsetcontrol-windows-x86_64.exe), а не архив: в нём может быть установщик.
          New-Item -ItemType Directory -Force -Path publish/headsetcontrol | Out-Null
          $tags = gh release list -R Sapd/HeadsetControl --limit 10 --exclude-pre-releases --json tagName -q '.[].tagName'
          foreach ($t in $tags) {
            gh release download $t -R Sapd/HeadsetControl --pattern "headsetcontrol-windows-x86_64.exe" --output publish/headsetcontrol/headsetcontrol.exe --clobber 2>$null
            if (Test-Path publish/headsetcontrol/headsetcontrol.exe) { Write-Host "HeadsetControl $t"; break }
          }
          if (-not (Test-Path publish/headsetcontrol/headsetcontrol.exe)) { throw "headsetcontrol-windows-x86_64.exe not found" }
          # проверка: настоящий консольный HeadsetControl отвечает на --help и сразу выходит
          $p = Start-Process publish/headsetcontrol/headsetcontrol.exe -ArgumentList "--help" -NoNewWindow -PassThru -RedirectStandardOutput hsc-help.txt
          if (-not $p.WaitForExit(10000)) { $p.Kill(); Remove-Item -Recurse -Force publish/headsetcontrol; throw "headsetcontrol.exe is not a console tool" }
          Get-Content hsc-help.txt -TotalCount 5

      - name: Add Vosk model (voice assistant)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" -OutFile vosk.zip
          Expand-Archive vosk.zip -DestinationPath vosk-tmp -Force
          New-Item -ItemType Directory -Force -Path publish/vosk | Out-Null
          Move-Item vosk-tmp/vosk-model-small-ru-0.22 publish/vosk/model
          Get-ChildItem publish/vosk/model

      - name: Self-test (voice token and speech model)
        shell: pwsh
        working-directory: publish
        run: |
          $p = Start-Process -FilePath .\WikarIsland.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          Remove-Item selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Online check (Microsoft neural voice)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        working-directory: publish
        run: |
          $p = Start-Process -FilePath .\WikarIsland.exe -ArgumentList "--selftest","--online" -PassThru
          if (-not $p.WaitForExit(200000)) { $p.Kill(); throw "Online voice check timed out" }
          Get-Content selftest.txt
          Remove-Item selftest.txt
          if ($p.ExitCode -ne 0) { throw "Online voice check failed" }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WikarIsland-win-x64
          path: publish/
          retention-days: 30
