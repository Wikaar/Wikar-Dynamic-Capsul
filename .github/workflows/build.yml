name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/WikarIsland/WikarIsland.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WikarIsland-win-x64
          path: publish/
          retention-days: 30
